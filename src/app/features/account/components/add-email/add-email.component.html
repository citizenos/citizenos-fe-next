<div class="overlay" [dialogClose]="undefined"></div>
<div class="dialog_wrap">
  <div id="notification_wrap_dialog" class="mobile_hidden">
    <cos-notifications></cos-notifications>
  </div>
  <div class="dialog">
    <div id="notification_wrap_dialog" class="mobile_show">
      <cos-notifications></cos-notifications>
    </div>
    <div class="dialog_header info">
      <div class="header_with_icon">
        <div>
          <cos-icon name="info-filled" [size]="40"></cos-icon>
        </div>
        <h4 class="title">{{ 'MODALS.ADD_EMAIL_HEADING' | translate }}</h4>
      </div>
      <div class="dialog_close">
        <a class="btn_dialog_close icon" [dialogClose]="undefined">
            <cos-icon name="close" [size]="24"></cos-icon>
        </a>
      </div>
    </div>
    <div class="dialog_content no_footer">
      <form [formGroup]="form">
        <input id="email" formControlName="email" type="email"
          [placeholder]="'MODALS.ADD_EMAIL_PLACEHOLDER_EMAIL' | translate"
          [maxlength]="254" />
        @if (form.controls['email'].touched && form.controls['email'].invalid) {
          <label for="email" class="error_label">
            <cos-icon name="warning-filled" [size]="16"></cos-icon>
            <span>{{ 'MODALS.ADD_EMAIL_ERROR_MSG_INVALID' | translate }}</span>
          </label>
        }
        <div class="delete_info_text bold">{{ 'MODALS.ADD_EMAIL_TXT_VERIFY' | translate }}</div>
      </form>
      <div class="button_wrap">
        <button class="btn_big_submit" (click)="doUpdateProfile()" [disabled]="form.invalid">
          {{ 'MODALS.ADD_EMAIL_LOG_IN' | translate }}
        </button>
        <button type="button" class="btn_link" (click)="logout()">{{ 'MODALS.ADD_EMAIL_LNK_CANCEL' | translate }}</button>
      </div>
      <div class="dialog_footer"></div>
    </div>
  </div>
</div>

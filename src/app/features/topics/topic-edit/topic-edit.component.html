<cos-create-wizard-shell
  [domainType]="domainType()"
  [headingKey]="headingKey()"
  [steps]="steps()"
  [currentStep]="currentStep()"
  [hasSidebar]="currentStep() !== 'preview'"
  [isNextDisabled]="isFooterNextDisabled()"
  [topic]="topic()"
  (stepChange)="onStepChange($event)"
  (saveDraft)="saveAsDraft()"
  (footerContinue)="handleFooterContinue()"
  (footerBack)="handleFooterBack()"
  (footerClose)="cancelEdit()"
  (footerPublish)="publishTopic()"
  (deleteTopic)="doDeleteTopic()"
>
  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="loader"></div>
    </div>
  }

  @switch (currentStep()) {
    @case ('info') {
      <cos-step-topic-info
        [topic]="topic() | any"
        (topicUpdate)="onTopicUpdate($any($event))"
        (imageFileUpdate)="onImageFileUpdate($any($event))"
      ></cos-step-topic-info>
    }
    @case ('settings') {
      <cos-step-topic-settings
        [topic]="topic() | any"
        (topicUpdate)="onTopicUpdate($any($event))"
        (groupsAdded)="onGroupsAdded($event)"
        (groupRemoved)="onGroupRemoved($event)"
      ></cos-step-topic-settings>
    }
    @case ('discussion') {
      <cos-step-topic-discussion
        [topic]="topic() | any"
        [discussion]="discussion()"
        (discussionChange)="onDiscussionChange($event)"
      ></cos-step-topic-discussion>
    }
    @case ('ideation') {
      <cos-step-ideation-settings
        [ideation]="ideation()"
        (ideationUpdate)="onIdeationChange($event)"
      ></cos-step-ideation-settings>
    }
    @case ('voting') {
      <cos-step-vote-settings
        [topic]="topic() | any"
        [vote]="vote()"
        (voteUpdate)="onVoteChange($event)"
      ></cos-step-vote-settings>
    }
    @case ('preview') {
      <cos-step-topic-preview
        [topic]="topic() | any"
        [ideation]="ideation()"
        [vote]="vote()"
        [discussion]="discussion()"
      ></cos-step-topic-preview>
    }
  }

  <div sidebar class="sidebar-block">
    <cos-member-editors-panel
      [topic]="topic() | any"
      [members]="members()"
      [invites]="invites()"
      (inviteEditors)="inviteEditors()"
    ></cos-member-editors-panel>
  </div>
</cos-create-wizard-shell>

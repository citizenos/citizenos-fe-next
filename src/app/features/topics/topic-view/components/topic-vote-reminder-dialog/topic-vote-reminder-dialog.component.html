<div class="overlay" dialogClose></div>
<div class="dialog_wrap">
  <div class="dialog">
    <div class="dialog_header voting">
      <div class="header_text">
        <div class="small_heading" translate="COMPONENTS.TOPIC_VOTE_REMINDER.DIALOG_HEADING"></div>
        <div class="dialog_close">
          <a class="btn_dialog_close icon" dialogClose>
            <cos-icon name="close" [size]="24"></cos-icon>
          </a>
        </div>
      </div>
    </div>

    <div class="dialog_content no_footer">
      <div class="text_wrap">
        <div class="content_description" translate="COMPONENTS.TOPIC_VOTE_REMINDER.DIALOG_DESCRIPTION"></div>
        <div class="line_separator"></div>
        <div translate="COMPONENTS.TOPIC_VOTE_REMINDER.REMINDER_PREVIEW_DESC"></div>
      </div>
      <div class="email_preview_wrap">
        <div class="email_preview">
          <div class="email_header">
            <div class="email_title_desc" translate="COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_HEADING"></div>
            <div class="email_title" [innerHTML]="data.topic.title"></div>
          </div>
          <div class="email_body">
            <div class="text_area">
              <span translate="COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_GREETING"
                [translateParams]="{ userName: user()?.name }"></span>
              <div>
                <span [translate]="data.vote.endsAt ? 'COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_TEXT_WARN' : 'COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_TEXT_PLEASE_VOTE'"></span>
                <span> </span>
                @if (data.vote.endsAt) {
                  <b translate="COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_TEXT_DAYS_LEFT"
                    [translateParams]="{ daysLeft: daysLeft() }"></b>
                }
              </div>
            </div>
            <div class="vote_info_wrap">
              <div class="vote_icon">
                <cos-icon name="check" [size]="32"></cos-icon>
              </div>
              <div class="vote_info_text">
                <div class="info_row">
                  <b translate="COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_VOTE_VOTES_COLLECTED"></b>
                  <b>{{ data.vote.votersCount || 0 }}</b>
                </div>
                @if (data.vote.endsAt) {
                  <span translate="COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_VOTE_DEADLINE"
                    [translateParams]="{ deadline: (data.vote.endsAt | date:'y-MM-dd HH:mm') }"></span>
                }
              </div>
            </div>
            <div class="button_wrap">
              <div class="btn_medium_submit" translate="COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_BTN_CAST_VOTE"></div>
            </div>
            <div class="notification_inline warning">
              <div class="icon_notification">
                <cos-icon name="warning-filled" [size]="24"></cos-icon>
              </div>
              <div class="message" [innerHTML]="'COMPONENTS.TOPIC_VOTE_REMINDER.PREVIEW_EMAIL_ATTENTION' | translate:{ email: user()?.email }"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="button_wrap">
        <button class="btn_medium_secondary" [dialogClose]="true"
          translate="COMPONENTS.TOPIC_VOTE_REMINDER.BTN_SEND_REMINDER"></button>
        <a dialogClose translate="COMPONENTS.TOPIC_VOTE_REMINDER.LNK_CANCEL"></a>
      </div>
    </div>
  </div>
</div>

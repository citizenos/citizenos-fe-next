<div class="overlay" dialogClose></div>
<div class="dialog_wrap">
  <div class="dialog">
    <div class="dialog_header voting">
      <div class="header_text">
        <h4 class="title" translate="MODALS.TOPIC_VOTE_SIGN_ESTEID_HEADING"></h4>
        <div class="dialog_close">
          <a class="btn_dialog_close icon" dialogClose>
            <cos-icon name="close" [size]="24"></cos-icon>
          </a>
        </div>
      </div>
    </div>
    <div class="dialog_content no_footer">
      <div class="vote_options">
        @if (data.options.length === 1) {
          <span translate="MODALS.TOPIC_VOTE_SIGN_TXT_VOTING_FOR" [translateParams]="{ optionSelected: data.options[0] }"></span>
        }
        @for (option of data.options; track option.id) {
          @if (option.selected) {
            <div class="vote_option radio_wrap selected">
              <div class="radio_text_wrap">
                <div class="radio_lable_wrap">
                  <label class="checkbox">
                    <span [translate]="'COMPONENTS.TOPIC_VOTE_CREATE.LBL_OPTION_' + option.value | uppercase"
                      [translateParams]="{ default: option.value }"></span>
                    <input type="checkbox" [checked]="true" />
                    <span class="checkmark"></span>
                  </label>
                </div>
              </div>
            </div>
          }
        }
      </div>
      <div class="form_wrap">
        <form [formGroup]="mobiilIdForm" novalidate>
          <!-- Mobile-ID section -->
          <div class="sign_in_section">
            @if (isLoading() && !challengeID()) {
              <div class="loader_wrap"><div class="loader"></div></div>
            }
            @if (!challengeID() && !isLoading()) {
              <cos-input [placeholder]="'MODALS.TOPIC_VOTE_SIGN_ESTEID_PLACEHOLDER_PHONE' | translate">
                <input formControlName="phoneNumber" type="tel"
                  [placeholder]="'MODALS.TOPIC_VOTE_SIGN_ESTEID_PLACEHOLDER_PHONE' | translate" />
              </cos-input>
              <cos-input [placeholder]="'MODALS.TOPIC_VOTE_SIGN_ESTEID_PLACEHOLDER_PID' | translate">
                <input formControlName="pid" type="text" inputmode="numeric"
                  [placeholder]="'MODALS.TOPIC_VOTE_SIGN_ESTEID_PLACEHOLDER_PID' | translate" />
              </cos-input>
            }
            @if (challengeID()) {
              <div class="control_code_wrap">
                <div class="code" translate="MODALS.TOPIC_VOTE_SIGN_ESTEID_TXT_CONTROL_CODE"
                  [translateParams]="{ code: challengeID() }"></div>
                <div class="code_text" translate="MODALS.TOPIC_VOTE_SIGN_ESTEID_TXT_CHECK_CONTROL_CODE"></div>
                <div class="loader_wrap"><div class="loader"></div></div>
              </div>
            }
            <button type="button" (click)="doSignWithMobile()"
              [disabled]="isLoading() || isLoadingIdCard() || mobiilIdForm.invalid" class="btn_big_submit">
              <span translate="MODALS.TOPIC_VOTE_SIGN_ESTEID_BTN_SIGN_MID"></span>
            </button>
          </div>

          <!-- ID card section -->
          <div class="sign_in_section">
            @if (isLoadingIdCard()) {
              <div class="loader_wrap id_card_loader"><div class="loader"></div></div>
            } @else {
              <button type="button" (click)="doSignWithCard()" [disabled]="isLoading() || isLoadingIdCard()" class="btn_big_submit">
                <span translate="MODALS.TOPIC_VOTE_SIGN_ESTEID_BTN_SIGN_CARD"></span>
              </button>
            }
          </div>
        </form>
      </div>
    </div>
    <div class="dialog_footer"></div>
  </div>
</div>

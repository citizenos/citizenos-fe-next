<div class="overlay" dialogClose (keydown.enter)="dialogRef.close()" role="button" tabindex="0"></div>
<div class="dialog_wrap">
  <div class="dialog">
    <div class="dialog_header warning">
      <div class="header_with_icon">
        <div class="icon_notification">
            <cos-icon name="warning-filled" [size]="40"></cos-icon>
        </div>
        <h4 class="title">{{ 'COMPONENTS.CLOSE_VOTING_CONFIRM.HEADING' | translate }}</h4>
      </div>
      <div class="dialog_close">
        <button type="button" class="btn_dialog_close icon" dialogClose [aria-label]="'CONTROL.CLOSE' | translate">
            <cos-icon name="close" [size]="24"></cos-icon>
        </button>
      </div>
    </div>
    <div class="dialog_content">
      <div class="info_row center" translate="COMPONENTS.CLOSE_VOTING_CONFIRM.ARE_YOU_SURE"></div>
    </div>
    @if (data.topic.ideationId || data.topic['discussionId']) {
      <div class="dialog_content">
        <div class="info_row center" translate="COMPONENTS.CLOSE_VOTING_CONFIRM.CLOSE_VOTING_DESCRIPTION"></div>
      </div>
    }
    <div class="dialog_content no_footer">
      <div class="button_wrap">
        <button type="button" class="btn_big_submit" [dialogClose]="true">{{ 'COMPONENTS.CLOSE_VOTING_CONFIRM.CONFIRM_YES' | translate }}</button>
        <button type="button" class="btn_link" dialogClose>{{ 'COMPONENTS.CLOSE_VOTING_CONFIRM.CONFIRM_NO' | translate }}</button>
      </div>
    </div>
    <div class="dialog_footer"></div>
  </div>
</div>

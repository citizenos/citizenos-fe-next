<div class="dialog_wrap">
  <div class="dialog">
    <div class="dialog_header">
      <div class="header_text">
        <h3 class="title" translate="MODALS.TOPIC_REPORT_REVIEW_HEADING"></h3>
      </div>
      <div class="dialog_close">
        <button class="btn_dialog_close icon" dialogClose>
          <cos-icon name="nav-close"></cos-icon>
        </button>
      </div>
    </div>

    <div class="dialog_content">
      <div class="content_text" translate="MODALS.TOPIC_REPORT_REVIEW_DESCRIPTION"></div>

      <form [formGroup]="reviewForm" (ngSubmit)="doReview()">
        <div class="form_group">
          <label translate="COMPONENTS.TOPIC_REPORT_REVIEW.LBL_REVIEW_TEXT"></label>
          <textarea formControlName="text"
                    [placeholder]="'COMPONENTS.TOPIC_REPORT_REVIEW.PLACEHOLDER_REVIEW_TEXT' | translate"
                    maxlength="2024"></textarea>
          <div class="char_count">{{ reviewForm.get('text')?.value?.length || 0 }}/2024</div>
        </div>
      </form>
    </div>

    <div class="dialog_footer with_buttons">
      <div class="button_row">
        <cos-button variant="secondary" (clicked)="close()" translate="COMPONENTS.TOPIC_REPORT_REVIEW.BTN_CANCEL"></cos-button>
        <cos-button variant="primary" (clicked)="doReview()" [disabled]="reviewForm.invalid || isLoading()" translate="COMPONENTS.TOPIC_REPORT_REVIEW.BTN_REVIEW"></cos-button>
      </div>
    </div>
  </div>
</div>

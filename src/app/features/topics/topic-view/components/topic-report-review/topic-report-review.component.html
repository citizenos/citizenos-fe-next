<div class="dialog_wrap">
  <div class="dialog">
    <div class="dialog_header info">
      <div class="header_with_icon">
        <div class="icon_notification">
          <cos-icon name="info-filled" [size]="40"></cos-icon>
        </div>
        <h3 class="title">{{ 'MODALS.TOPIC_REPORT_REVIEW_HEADING' | translate }}</h3>
      </div>
      <div class="dialog_close">
        <button type="button" class="btn_dialog_close icon" dialogClose [aria-label]="'CONTROL.CLOSE' | translate">
          <cos-icon name="nav-close"></cos-icon>
        </button>
      </div>
    </div>

    <div class="dialog_content">
      <div class="content_text">{{ 'MODALS.TOPIC_REPORT_REVIEW_DESCRIPTION' | translate }}</div>

      <form [formGroup]="reviewForm" (ngSubmit)="doReview()">
        <div class="form_group">
          <label for="review_text">{{ 'COMPONENTS.TOPIC_REPORT_REVIEW.LBL_REVIEW_TEXT' | translate }}</label>
          <textarea id="review_text" formControlName="text"
                    [placeholder]="'COMPONENTS.TOPIC_REPORT_REVIEW.PLACEHOLDER_REVIEW_TEXT' | translate"
                    maxlength="2024"></textarea>
          <div class="char_count">{{ reviewForm.get('text')?.value?.length || 0 }}/2024</div>
        </div>
      </form>
    </div>

    <div class="dialog_footer with_buttons">
      <div class="button_row">
        <cos-button variant="secondary" (clicked)="close()" translate="COMPONENTS.TOPIC_REPORT_REVIEW.BTN_CANCEL"></cos-button>
        <cos-button variant="primary" (clicked)="doReview()" [isDisabled]="reviewForm.invalid || isLoading()" translate="COMPONENTS.TOPIC_REPORT_REVIEW.BTN_REVIEW"></cos-button>
      </div>
    </div>
  </div>
</div>

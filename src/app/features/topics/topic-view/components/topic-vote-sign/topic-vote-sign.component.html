<div class="overlay" dialogClose (keydown.enter)="dialogRef.close()" role="button" tabindex="0"></div>
<div class="dialog_wrap">
  <div id="notification_wrap_dialog" class="mobile_hidden">
    <cos-notifications></cos-notifications>
  </div>
  <div class="dialog">
    <div id="notification_wrap_dialog" class="mobile_show">
      <cos-notifications></cos-notifications>
    </div>
    <div class="dialog_header voting">
      <div class="header_text">
        <h4 class="title">{{ 'MODALS.TOPIC_VOTE_SIGN_HEADING' | translate }}</h4>
        <div class="dialog_close">
          <cos-button [iconMode]="true" variant="ghost" size="md" icon="close" dialogClose [aria-label]="'BTN_CLOSE' | translate"></cos-button>
        </div>
      </div>
    </div>
    <div class="dialog_content no_footer">
      <cos-button class="btn-sign" variant="light" (clicked)="doSignEsteId()">
        <cos-icon name="est-id" size="32"></cos-icon>
        <span>{{ 'MODALS.TOPIC_VOTE_SIGN_BTN_SIGN_ESTEID' | translate }}</span>
      </cos-button>

      <cos-button class="btn-sign" variant="light" (clicked)="doSignSmartId()">
        <cos-icon name="smart-id" size="32"></cos-icon>
        <span>{{ 'MODALS.TOPIC_VOTE_SIGN_BTN_SIGN_SMARTID' | translate }}</span>
      </cos-button>
    </div>
    <div class="dialog_footer"></div>
  </div>
</div>

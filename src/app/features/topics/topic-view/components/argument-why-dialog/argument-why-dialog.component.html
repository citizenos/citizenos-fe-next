<div class="dialog_wrap">
  <div class="dialog">
    <div class="dialog_header">
      <div class="header_with_icon">
        <div class="icon_notification">
          <cos-icon name="info-filled" [size]="40"></cos-icon>
        </div>
        <h4 class="title">{{ 'COMPONENTS.ARGUMENT_WHY.HEADING' | translate }}</h4>
      </div>
      <div class="dialog_close">
        <button type="button" class="btn_dialog_close icon" dialogClose [aria-label]="'CONTROL.CLOSE' | translate">
          <cos-icon name="nav-close"></cos-icon>
        </button>
      </div>
    </div>
    <div class="dialog_content no_footer">
      <div class="content_text">{{ 'COMPONENTS.ARGUMENT_WHY.MESSAGE_MAIN' | translate }}</div>
      <div class="dialog_info_wrap">
        <div class="dialog_info">
          <div class="bold">{{ 'TXT_MODERATION_TYPES_' + (argument.deletedReasonType | uppercase) | translate }}</div>
          <div class="text" [innerHTML]="argument.deletedReasonText"></div>
        </div>
      </div>
    </div>
  </div>
</div>

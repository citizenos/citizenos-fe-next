<div [class]="'edits_wrap ' + argument().type">
  <div class="edits_header">
    <h2 class="small_heading">{{ 'COMPONENTS.ARGUMENT_EDITS.HEADING' | translate }}</h2>
    <button type="button" class="btn_link" (click)="hideEdits()">{{ 'COMPONENTS.ARGUMENT_EDITS.LNK_HIDE_EDITS' | translate }}</button>
  </div>
  <div class="edits_content">
    @for (entry of editsEntries(); track entry[0]) {
      <div [id]="argument().id + '_v' + entry[0]" [class]="'argument_edit is_' + (entry[1].type || argument().type)">
        <div class="argument_header">
          <div class="date_wrap">
            <div>
              <cos-icon name="argument-edits-icon-legacy" size="16"></cos-icon>
            </div>
            <span>{{ entry[1].createdAt | date : 'y-MM-dd HH:mm' }}</span>
          </div>
          <button type="button" class="btn_link" (click)="copyArgumentLink($event, entry[0])">{{ 'LNK_DIRECT_LINK' | translate }}</button>
        </div>
        <div class="argument_content">
          @if (entry[1].subject) {
            <div class="argument_subject">{{ entry[1].subject }}</div>
          }
          <div class="argument_body" [innerHTML]="entry[1].text"></div>
        </div>
      </div>
    }
  </div>
</div>

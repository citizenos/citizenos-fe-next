<div class="overlay" dialogClose></div>
<div class="dialog_wrap">
  <div class="dialog">
    <div class="dialog_header">
      <div class="header_with_icon">
        <div class="icon_notification">
            <cos-icon name="info-filled" [size]="40"></cos-icon>
        </div>
        <h4 class="title" translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.HEADING"></h4>
      </div>
      <div class="dialog_close">
        <a class="btn_dialog_close icon" dialogClose>
            <cos-icon name="close" [size]="24"></cos-icon>
        </a>
      </div>
    </div>
    <div class="dialog_content">
      <div class="info_row" translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.MESSAGE_DESCRIPTION"></div>
    </div>
    <div class="dialog_content">
      <div class="dialog_info_wrap">
        <div class="dialog_info_heading">
          <div class="bold" translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.MESSAGE_OPTIONS"></div>
        </div>
        <div class="dialog_info">
          <div class="info_heading bold" translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.HEADING_NOT_DOWNLOAD"></div>
          <div class="row">
            <div>
              <cos-icon name="check" [size]="24"></cos-icon>
            </div>
            <span translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.UPDATE_DEADLINE"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="dialog_content">
      <div class="dialog_info_wrap">
        <div class="dialog_info">
          <div class="info_heading bold" translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.HEADING_DOWNLOAD"></div>
          <div class="row">
            <div>
              <cos-icon name="check" [size]="24"></cos-icon>
            </div>
            <span translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.GET_RESULTS"></span>
          </div>
          <div class="row">
            <div>
              <cos-icon name="check" [size]="24"></cos-icon>
            </div>
            <span translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.FOLLOW_UP"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="dialog_content no_footer">
      <div class="button_wrap">
        <button class="btn_big_submit" [dialogClose]="'deadline'" translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.BTN_EDIT_DEADLINE"></button>
        <button class="btn_big_submit" [dialogClose]="true" translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.BTN_SUBMIT"></button>
        <a dialogClose translate="COMPONENTS.DOWNLOAD_VOTING_RESULTS.BTN_CANCEL"></a>
      </div>
    </div>
    <div class="dialog_footer"></div>
  </div>
</div>

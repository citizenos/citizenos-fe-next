<div class="create_content">
  <!-- Discussion Question Section -->
  <div class="create_content_section">
    <div class="number_wrap">1</div>
    <div class="section_content_wrap">
      <div class="header_wrap">
        <div class="small_heading" translate="VIEWS.TOPIC_CREATE.SETTINGS_HEADING_DISCUSSION_QUESTION"></div>
        <div class="description" translate="VIEWS.TOPIC_CREATE.SETTINGS_HEADING_DISCUSSION_QUESTION_DESC"></div>
      </div>
      <input
        class="question-input"
        type="text"
        [placeholder]="'VIEWS.TOPIC_CREATE.SETTINGS_DISCUSSION_QUESTION_PLACEHOLDER' | translate"
        [ngModel]="discussion().question"
        (ngModelChange)="onQuestionChange($event)"
      />
    </div>
  </div>

  <!-- Discussion Deadline Section -->
  <div class="create_content_section">
    <div class="number_wrap">2</div>
    <div class="section_content_wrap">
      <div class="header_wrap">
        <div class="small_heading" translate="VIEWS.TOPIC_CREATE.SETTINGS_HEADING_DISCUSSION_DEADLINE"></div>
        <div class="description" translate="VIEWS.TOPIC_CREATE.SETTINGS_HEADING_DISCUSSION_DEADLINE_DESC"></div>
      </div>
      <div class="radio_wrap" [class.selected]="deadlineEnabled()">
        <div class="radio_text_wrap">
          <div class="radio_lable_wrap">
            <label class="checkbox">
              <input
                type="checkbox"
                [checked]="deadlineEnabled()"
                (change)="toggleDeadline(); $event.stopPropagation()"
              />
              <span class="bold" translate="VIEWS.TOPIC_CREATE.LBL_OPTION_DEADLINE"></span>
            </label>
          </div>
          @if (deadlineEnabled()) {
            <div class="deadline_wrap">
              <input
                class="deadline-input"
                type="datetime-local"
                [ngModel]="discussion().deadline"
                (ngModelChange)="onDeadlineChange($event)"
              />
            </div>
          }
        </div>
      </div>
    </div>
  </div>

</div>

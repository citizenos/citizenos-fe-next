<cos-create-wizard-shell
  domainType="topic"
  headingKey="VIEWS.TOPIC_CREATE.HEADING"
  [steps]="steps"
  [currentStep]="currentStep()"
  [hasSidebar]="true"
  [isNextDisabled]="isFooterNextDisabled()"
  [topic]="topicModel()"
  (stepChange)="onStepChange($event)"
  (saveDraft)="saveAsDraft()"
  (footerContinue)="handleFooterContinue()"
  (footerBack)="handleFooterBack()"
  (deleteTopic)="doDeleteTopic()"
>
  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="loader"></div>
    </div>
  }

  @switch (currentStep()) {
    @case ('info') {
      <cos-step-topic-info
        [topic]="topicModel()"
        (topicUpdate)="onTopicUpdate($event)"
        (imageFileUpdate)="onImageFileUpdate($event)"
      ></cos-step-topic-info>
    }
    @case ('settings') {
      <cos-step-topic-settings
        [topic]="topicModel()"
        [isCreatedFromGroup]="isCreatedFromGroup()"
        (topicUpdate)="onTopicUpdate($event)"
        (groupsAdded)="onGroupsAdded($event)"
        (groupRemoved)="onGroupRemoved($event)"
      ></cos-step-topic-settings>
    }
    @case ('discussion') {
      <cos-step-topic-discussion
        [discussion]="discussion()"
        (discussionChange)="discussion.set($event)"
      ></cos-step-topic-discussion>
    }
    @case ('preview') {
      <cos-step-topic-preview
        [topic]="topicModel()"
        [discussion]="discussion()"
      ></cos-step-topic-preview>
    }
    @default {
    }
  }

  <div sidebar class="sidebar-block">
    <cos-member-editors-panel
      [topic]="topicModel()"
      [members]="members()"
      [invites]="invites()"
      (inviteEditors)="inviteEditors()"
    ></cos-member-editors-panel>
  </div>

<cos-create-wizard-shell
  domainType="topic"
  headingKey="VIEWS.TOPIC_CREATE.HEADING"
  [steps]="steps"
  [currentStep]="currentStep()"
  [hasSidebar]="currentStep() !== 'preview'"
  (stepChange)="onStepChange($event)"
  (saveDraft)="saveAsDraft()"
>
  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="loader"></div>
    </div>
  }

  @switch (currentStep()) {
    @case ('info') {
      <cos-step-topic-info
        [topic]="topic() | any"
        (topicUpdate)="onTopicUpdate($any($event))"
        (imageFileUpdate)="onImageFileUpdate($any($event))"
        (next)="saveToSettings()"
      ></cos-step-topic-info>
    }
    @case ('settings') {
      <cos-step-topic-settings
        [topic]="topic() | any"
        (topicUpdate)="onTopicUpdate($any($event))"
        (next)="currentStep.set('discussion')"
        (previous)="currentStep.set('info')"
      ></cos-step-topic-settings>
    }
    @case ('discussion') {
      <cos-step-topic-discussion
        [discussion]="discussion()"
        (discussionChange)="discussion.set($event)"
        (next)="transitionToPreview()"
        (previous)="currentStep.set('settings')"
      ></cos-step-topic-discussion>
    }
    @case ('preview') {
      <cos-step-topic-preview
        [topic]="topic() | any"
        (previous)="currentStep.set('discussion')"
        (save)="publishTopic()"
      ></cos-step-topic-preview>
    }
  }

  <div sidebar class="sidebar-block">
    <cos-member-editors-panel
      [members]="members()"
      [invites]="invites()"
      (inviteEditors)="inviteEditors()"
    ></cos-member-editors-panel>
  </div>
</cos-create-wizard-shell>

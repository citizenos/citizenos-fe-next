<cos-create-wizard-shell
  domainType="ideation"
  headingKey="VIEWS.IDEATION_CREATE.HEADING"
  [steps]="steps"
  [currentStep]="currentStep()"
  [isNextDisabled]="isFooterNextDisabled()"
  [topic]="topicModel()"
  (stepChange)="onStepChange($event)"
  (saveDraft)="saveAsDraft()"
  (footerContinue)="handleFooterContinue()"
  (footerBack)="handleFooterBack()"
  (deleteTopic)="doDeleteTopic()"
>
  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="loader"></div>
    </div>
  }

  @switch (currentStep()) {
    @case ('info') {
      <cos-step-topic-info
        [topic]="topicModel()"
        (topicUpdate)="onTopicUpdate($event)"
      ></cos-step-topic-info>
    }
    @case ('settings') {
      <cos-step-topic-settings
        [topic]="topicModel()"
        (topicUpdate)="onTopicUpdate($event)"
        (groupsAdded)="onGroupsAdded($event)"
        (groupRemoved)="onGroupRemoved($event)"
      ></cos-step-topic-settings>
    }
    @case ('ideation') {
      <cos-step-ideation-settings
        [ideation]="ideationModel()"
        (ideationUpdate)="onIdeationUpdate($event)"
      ></cos-step-ideation-settings>
    }
    @case ('preview') {
      <cos-step-topic-preview
        [topic]="topicModel()"
        [ideation]="ideationModel()"
      ></cos-step-topic-preview>
    }
    @default {
    }
  }

  <div sidebar class="sidebar_block">
    <cos-member-editors-panel
      [topic]="topicModel()"
      [members]="members()"
      [invites]="invites()"
      (inviteEditors)="inviteEditors()"
    ></cos-member-editors-panel>
  </div>
</cos-create-wizard-shell>

<cos-create-wizard-shell
  domainType="vote"
  [headingKey]="topicModel().status && topicModel().status !== 'draft' ? 'VIEWS.VOTE_EDIT.HEADING' : 'VIEWS.VOTE_CREATE.HEADING'"
  [steps]="steps"
  [currentStep]="currentStep()"
  [hasSidebar]="true"
  [isNextDisabled]="isFooterNextDisabled()"
  [topic]="topicModel()"
  (stepChange)="onStepChange($event)"
  (saveDraft)="saveAsDraft()"
  (footerContinue)="handleFooterContinue()"
  (footerBack)="handleFooterBack()"
  (footerPublish)="onPublish()"
  (deleteTopic)="doDeleteTopic()"
>
  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="loader"></div>
    </div>
  }

  @switch (currentStep()) {
    @case ('info') {
      <cos-step-topic-info
        [topic]="topicModel()"
        (topicUpdate)="onTopicUpdate($event)"
      ></cos-step-topic-info>
    }
    @case ('settings') {
      <cos-step-topic-settings
        [topic]="topicModel()"
        (topicUpdate)="onTopicUpdate($event)"
        (groupsAdded)="onGroupsAdded($event)"
        (groupRemoved)="onGroupRemoved($event)"
      ></cos-step-topic-settings>
    }
    @case ('voting') {
      <cos-step-vote-settings
        [vote]="voteModel()"
        [topic]="topicModel()"
        (voteUpdate)="onVoteUpdate($event)"
      ></cos-step-vote-settings>
    }
    @case ('preview') {
      <cos-step-topic-preview
        [topic]="topicModel()"
        [vote]="voteModel()"
      ></cos-step-topic-preview>
    }
    @default {
    }
  }

  <div sidebar class="sidebar_block">
    <cos-member-editors-panel
      [topic]="topicModel()"
      [members]="members()"
      [invites]="invites()"
      (inviteEditors)="inviteEditors()"
    ></cos-member-editors-panel>
  </div>

        <div id="help_text_wrap" (click)="toggleHelp()" (keydown.enter)="toggleHelp()" role="button" tabindex="0">
          <div class="title">
            <span translate="VIEWS.VOTE_CREATE.HELP_HEADING"></span>
            <div class="mobile_icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            </div>
          </div>
          <div class="description_text">

          </div>
        </div>

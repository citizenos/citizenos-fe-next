<cos-create-wizard-shell
  domainType="vote"
  headingKey="VIEWS.VOTE_CREATE.HEADING"
  [steps]="steps"
  [currentStep]="currentStep()"
  [isNextDisabled]="isFooterNextDisabled()"
  (stepChange)="onStepChange($event)"
  (saveDraft)="saveAsDraft()"
  (footerContinue)="handleFooterContinue()"
  (footerBack)="handleFooterBack()"
>
  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="loader"></div>
    </div>
  }

  @switch (currentStep()) {
    @case ('info') {
      <cos-step-topic-info
        [topic]="$any(topic())"
        (topicUpdate)="onTopicUpdate($event)"
      ></cos-step-topic-info>
    }
    @case ('settings') {
      <cos-step-topic-settings
        [topic]="$any(topic())"
        (topicUpdate)="onTopicUpdate($event)"
      ></cos-step-topic-settings>
    }
    @case ('voting') {
      <cos-step-vote-settings
        [vote]="$any(vote())"
        (voteUpdate)="onVoteUpdate($event)"
      ></cos-step-vote-settings>
    }
    @case ('preview') {
      <cos-step-topic-preview
        [topic]="$any(topic())"
        [vote]="vote()"
      ></cos-step-topic-preview>
    }
  }
</cos-create-wizard-shell>

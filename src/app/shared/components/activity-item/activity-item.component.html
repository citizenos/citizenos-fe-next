<a class="activity_wrap" (click)="redirect(activity)">
  @if (activity.isNew) {
    <div id="new_activity">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="7" r="6" fill="#F39129" stroke="#EBF4FB" stroke-width="2" />
      </svg>
    </div>
  }
  <div class="activity_header">
    <div class="activity_icon">
      @switch (activity.values?.className) {
        @case ('discussion') {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M14 9.76344C14.024 9.72875 14.0472 9.69281 14.0709 9.65906C14.6753 8.76079 14.9987 7.70299 15 6.62031C15.01 3.51719 12.3918 1 9.15435 1C6.3306 1 3.97497 2.92156 3.4231 5.4725C3.34031 5.85056 3.2984 6.23642 3.2981 6.62344C3.2981 9.72969 5.8156 12.3144 9.0531 12.3144C9.56778 12.3144 10.2612 12.1597 10.6415 12.0553C11.0218 11.9509 11.3987 11.8131 11.4962 11.7759C11.5937 11.7387 11.7462 11.7006 11.8678 11.7356L14.2872 12.435C14.4434 12.2831L13.8897 10.1741C13.8512 10.0178 13.8462 9.98844 14 9.76344Z" fill="#1168A8"/>
            <path d="M9.76691 12.9809C9.52643 13.0193 9.28353 13.0407 9.04004 13.0449C7.7141 13.0449 6.46191 12.6949 5.44629 12.0387C4.79661 11.6399 4.23267 11.116 3.78722 10.4974C2.97222 9.4171 2.52785 8.04398 2.52785 6.6071C2.52785 6.50929 2.53129 6.41523 2.53472 6.32085C2.48534 6.21848 2.39695 6.17639 2.36975 6.18244C2.34256 6.1885 1.55083 7.04207 1.01431 9.19386C0.930138 10.2998 1.21898 11.4021 1.83472 12.3246C1.91191 12.4424 1.50191 14.8521C1.66504 14.9937L3.79004 14.2362C4.19378 14.243 4.82972 14.493 5.53316 14.6468C7.5906 14.6512 8.89485 14.1368 9.88129 13.2093C9.84907 12.9811 9.76691 12.9809Z" fill="#1168A8"/>
          </svg>
        }
        @case ('vote') {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.584 0 0 3.584 0 8C0 12.416 3.584 16 8 16C12.416 16 16 12.416 16 8C16 3.584 12.416 0 8 0ZM6.44444 12L12.6667 5.82456L11.5 4.66667L6.44444 9.68421L4.5 7.75439L3.33333 8.91228L6.44444 12Z" fill="#5AB467"/>
          </svg>
        }
        @case ('personal') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="#2C3B47"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M6 17.4444C6 14.9898 7.79086 13 10 13H14C16.2091 13 18 14.9898 18 17.4444V23H6V17.4444Z" fill="#2C3B47"/>
          </svg>
        }
        @case ('group') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M9 12C11.7614 12 14 9.76142 14 7C14 4.23858 11.7614 2 9 2C6.23858 2 4 4.23858 4 7C4 9.76142 6.23858 12 9 12Z" fill="#2C3B47"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M18 7C18 4.98236 16.3708 4 15 4V2C17.1492 2 20 3.57764 20 7C20 10.4224 17.1492 12 15 12V10C16.3708 10 18 9.01764 18 7Z" fill="#2C3B47"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M16 13H17C19.2091 13 21 14.7909 21 17V22H19V17C19 15.8954 18.1046 15 17 15H16V13Z" fill="#2C3B47"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3 17C3 14.7909 4.79086 13 7 13H11C13.2091 13 15 14.7909 15 17V22H3V17Z" fill="#2C3B47"/>
          </svg>
        }
      }
    </div>
    <div class="date">{{ activity.updatedAt | date:'y-MM-dd HH:mm' }}</div>
  </div>
  <div class="activity_content">
    @if (count > 1) {
      <div [innerHTML]="translate_group(activityGroup())"></div>
    } @else {
      <div [innerHTML]="translate_activity(activity)"></div>
    }
    @if (activityService.showActivityUpdateVersions(activity)) {
      <i>
        <div [innerHTML]="translate_version(activity, 'previous')"></div>
        <div [innerHTML]="translate_version(activity, 'new')"></div>
      </i>
    }
  </div>
</a>

<button class="bold" [class.btn_medium_activity]="true" (click)="open()">
  @if (!groupId() && !topicId()) {
    <span>{{ 'VIEWS.DASHBOARD.BTN_GLOBAL_ACTIVITIES' | translate }}</span>
  } @else if (groupId()) {
    <span>{{ 'VIEWS.GROUP.BTN_ACTIVITIES' | translate }}</span>
  } @else {
    <span>{{ 'VIEWS.TOPICS_TOPICID.BTN_ACTIVITIES' | translate }}</span>
  }

  @if (unreadCount() > 0) {
    <div class="bell_unread tablet_show mobile_show">
      <svg width="30" height="31" viewBox="0 0 30 31" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10.1148 10.5947C8.90606 10.9722 7.82864 11.7055 7.0227 12.7085C6.08431 13.8764 5.57162 15.3382 5.57143 16.8464C5.57143 17.8912 5.23103 21.5697 4.30255 23.9997C3.95506 24.909 3.52521 25.6435 3 25.9997H10C10 26.5301 10.2107 27.0388 10.5858 27.4139C10.9609 27.7889 11.4696 27.9997 12 27.9997C12.5304 27.9997 13.0391 27.7889 13.4142 27.4139C13.7893 27.0388 14 26.5301 14 25.9997H21C20.4748 25.6435 20.0449 24.909 19.6975 23.9997C19.2164 22.7408 18.8932 21.1467 18.6935 19.7574C17.9626 19.6015 17.2586 19.3729 16.5894 19.0797C16.6874 19.9331 16.8327 20.9088 17.0324 21.8756C17.1767 22.5741 17.3562 23.3027 17.5795 23.9997H6.42045C6.64383 23.3027 6.82333 22.5741 6.96759 21.8756C7.39259 19.8179 7.57139 17.7198 7.57143 16.8464C7.57162 15.7905 7.93083 14.7713 8.58177 13.9612C9.11165 13.3018 9.80724 12.8146 10.584 12.5456C10.3707 11.9188 10.2124 11.2666 10.1148 10.5947Z" fill="currentColor" />
        <svg x="11" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="9" fill="#F39129" />
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff">{{ unreadCount() }}</text>
        </svg>
      </svg>
    </div>
    <div class="btn_medium_activity_new tablet_hidden mobile_hidden">
      {{ unreadCount() }}
      <cos-icon name="activities-button-icon-legacy" size="16"></cos-icon>
    </div>
  } @else {
    <div class="tablet_show mobile_show">
      <cos-icon name="activities-button-icon-2-legacy" size="24"></cos-icon>
    </div>
    <div class="tablet_hidden mobile_hidden">
      <cos-icon name="activities-button-icon-3-legacy" size="16"></cos-icon>
    </div>
  }
</button>

<div class="overlay" dialogClose></div>
<div class="dialog_wrap">
  <div id="notification_wrap_dialog" class="mobile_hidden">
    <cos-notifications></cos-notifications>
  </div>
  <div class="dialog">
    <div id="notification_wrap_dialog" class="mobile_show">
      <cos-notifications></cos-notifications>
    </div>
    <div class="dialog_header warning">
      <div class="header_with_icon">
        <div class="icon_notification">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="20" fill="#F39129" />
            <path
              d="M19.0645 8C18.4876 8 18.0304 8.48668 18.0664 9.06238L18.9414 23.0624C18.9743 23.5894 19.4114 24 19.9395 24H20.0605C20.5886 24 21.0257 23.5894 21.0586 23.0624L21.9336 9.06238C21.9696 8.48668 21.5124 8 20.9355 8H19.0645Z"
              fill="white" />
            <path
              d="M20 31C21.1046 31 22 30.1046 22 29C22 27.8954 21.1046 27 20 27C18.8954 27 18 27.8954 18 29C18 30.1046 18.8954 31 20 31Z"
              fill="white" />
          </svg>
        </div>
        <h4 class="title">{{ 'MODALS.INTERRUPT_HEADING' | translate }}</h4>
      </div>
      <div class="dialog_close">
        <button type="button" class="btn_dialog_close icon" dialogClose [attr.aria-label]="'BTN_CLOSE' | translate">
          <cos-icon name="topic-tour-icon-legacy" size="24"></cos-icon>
        </button>
      </div>
    </div>
    <div class="dialog_content">
      <div class="info_row">{{ 'MODALS.INTERRUPT_ARE_YOU_SURE' | translate }}</div>
    </div>
    <div class="dialog_content">
      <div class="info_row">{{ 'MODALS.INTERRUPT_DESC' | translate }}</div>
    </div>
    <div class="dialog_content no_footer">
      <div class="button_wrap">
        <button type="button" class="btn_big_submit" [dialogClose]="true">{{ 'MODALS.INTERRUPT_BTN_SUBMIT' | translate }}</button>
        <button type="button" class="btn_link" dialogClose>{{ 'MODALS.INTERRUPT_BTN_CANCEL' | translate }}</button>
      </div>
    </div>
    <div class="dialog_footer"></div>
  </div>
</div>

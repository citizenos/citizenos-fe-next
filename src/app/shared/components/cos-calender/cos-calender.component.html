<div id="cos_calendar" [class]="class()">
  <div class="cos_cal_month_selector">
    <button type="button" (click)="setMonth(-1)">
      <cos-icon name="cos-calender-icon-legacy" size="24"></cos-icon>
    </button>
    <div class="text_wrap">
      <span [translate]="'COMPONENTS.COS_CALENDAR.MONTHS.' + month()"></span>
      <span>{{ year() }}</span>
    </div>
    <button type="button" (click)="setMonth(1)">
      <cos-icon name="cos-calender-icon-2-legacy" size="24"></cos-icon>
    </button>
  </div>
  <div class="cos_cal_weekdays">
    @for (day of weekdays; track day) {
      <div class="cos_cal_weekday bold">
        {{ 'COMPONENTS.COS_CALENDAR.WEEKDAYS.' + day | translate | slice:0:1 }}
      </div>
    }
  </div>
  <div class="line_separator"></div>
  <div class="cos_cal_days_wrap">
    @for (week of calendar(); track $index) {
      <div class="cos_cal_days">
        <div class="cos_cal_week">
          @for (day of week; track $index) {
            <button type="button" class="cos_cal_day" (click)="selectDate(day)">
              <span class="day_item" [ngClass]="{ 'empty': day < 0, 'selected': isSelected(day) }">{{ getDay(day) }}</span>
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
